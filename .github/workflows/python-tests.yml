name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Static and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall app cli entry shared scripts tests main.py

      - name: Ruff
        run: python -m ruff check app cli entry shared scripts tests

      - name: Mypy shared contracts
        run: python -m mypy

      - name: Bandit high-severity findings
        run: python -m bandit -q -lll -r app cli entry shared -x tests

      - name: Validate browser JavaScript
        shell: bash
        run: find app/web/static -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Architecture contracts
        run: |
          mkdir -p artifacts
          python -X faulthandler -m pytest tests/architecture tests/release/ci -q --junitxml=artifacts/quality.xml

      - name: Linux exact-generation contracts
        shell: bash
        run: |
          findmnt -T "$RUNNER_TEMP"
          python -X faulthandler -m pytest -q -rs \
          --basetemp="$RUNNER_TEMP/pytest-exact-generation" \
          --junitxml=artifacts/linux-exact-generation.xml \
          tests/integration/shared/test_linux_owned_generation.py \
          tests/unit/shared/test_filesystem_directory_capability.py \
          tests/unit/app/services/test_updater_owned_generation.py

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: artifacts/quality.xml
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: Package compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2.0"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel without source-tree fallback
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import version; from shared.version import __version__; import shared.runtime_adapters; import shared.selection_runtime; assert version('ucrawl') == __version__, (version('ucrawl'), __version__)"
          python -m entry.test_entry --self-check --verbose

      - name: Upload package artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Runtime dependency audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create isolated audit environment
        shell: pwsh
        run: |
          python -m venv .audit-venv
          .\.audit-venv\Scripts\python -m pip install --upgrade pip
          .\.audit-venv\Scripts\python -m pip install -r requirements.txt pip-audit~=2.9.0

      - name: Audit resolved runtime dependencies
        shell: pwsh
        run: .\.audit-venv\Scripts\python -m pip_audit --local --skip-editable --strict --progress-spinner off

  core-tests:
    name: Core shard / ${{ matrix.shard }}
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        # 单进程大杂烩曾把 5000+ 用例串在一台 runner 上跑约 26 分钟；
        # 按目录切成并行分片后每片独立进程，Qt/原生资源互不累积。
        shard: [unit, integration, release, misc, contract-1, contract-2, contract-3, contract-4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run shard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $shard = "${{ matrix.shard }}"
          $omit = "app/core/lib/douyin/encrypt/aBogus.py,app/core/lib/douyin/encrypt/verifyFp.py,app/core/lib/douyin/encrypt/xBogus.py,app/core/lib/douyin/encrypt/xGnarly.py"
          $coverageArgs = @("run", "--data-file=artifacts/.coverage-$shard", "--branch", "--source=app,cli,entry,shared", "--omit=$omit")

          switch ($shard) {
            "unit" {
              python -m coverage @coverageArgs -m pytest tests/unit -q --junitxml=artifacts/core-unit.xml
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            "integration" {
              python -m coverage @coverageArgs -m pytest tests/integration -q --junitxml=artifacts/core-integration.xml
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            "release" {
              python -m coverage @coverageArgs -m pytest tests/release -q --junitxml=artifacts/core-release.xml
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            "misc" {
              python -m coverage @coverageArgs -m pytest tests/architecture tests/testkit -q --junitxml=artifacts/core-misc.xml
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # 性能预算不插桩，避免计时代码被 coverage 拖慢。
              python -X faulthandler -m pytest tests/performance -q
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            default {
              # contract-N：按目录发现顺序把契约节点均分为 4 组，本片跑第 N 组。
              $shardIndex = [int]($shard.Split("-")[1])
              $groupCount = 4
              $contractFiles = @(
                python -c "from tests.support.catalog import get_resolved_files; print(*get_resolved_files('contract'), sep='\n')"
              )
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ($contractFiles.Count -eq 0) { throw "No contract tests were found through the suite catalog" }
              $contractNodes = @(
                python -m pytest $contractFiles --collect-only -q |
                  Where-Object { $_ -match "::" }
              )
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ($contractNodes.Count -eq 0) { throw "No contract test nodes were collected" }
              $groupSize = [Math]::Ceiling($contractNodes.Count / $groupCount)
              $start = ($shardIndex - 1) * $groupSize
              $end = [Math]::Min($start + $groupSize - 1, $contractNodes.Count - 1)
              if ($start -gt $end) {
                Write-Host "contract shard $shardIndex is empty; nothing to run"
                exit 0
              }
              [string[]] $chunk = $contractNodes[$start..$end]
              python -m coverage @coverageArgs -m pytest $chunk -q --junitxml="artifacts/core-contract-$shardIndex.xml"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-report-${{ matrix.shard }}
          path: |
            artifacts/core-*.xml
            artifacts/.coverage-*
          if-no-files-found: ignore
          retention-days: 14

  core-coverage:
    name: Core coverage report
    needs: [core-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download shard coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: core-report-*
          merge-multiple: true
          path: covdata

      - name: Combine and report coverage
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "coverage>=7,<8"
          python -m coverage combine covdata/.coverage-*
          python -m coverage report

  browser-tests:
    name: Browser shard / ${{ matrix.shard }}
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 192 个 Playwright 用例挤一个进程会在长跑中累积原生资源直至挂死；
        # 按节点均分 4 片独立进程，各自重建浏览器会话。
        shard: [browser-1, browser-2, browser-3, browser-4]
    env:
      QT_QPA_PLATFORM: offscreen
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Restore Playwright Chromium cache
        uses: actions/cache@v5
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium runtime
        run: |
          python -m playwright install chromium

      - name: Run browser shard
        id: browser_suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $shard = "${{ matrix.shard }}"
          $shardIndex = [int]($shard.Split("-")[1])
          $groupCount = 4
          $browserNodes = @(
            python -m pytest tests/e2e --collect-only -q |
              Where-Object { $_ -match "::" }
          )
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($browserNodes.Count -eq 0) { throw "No browser test nodes were collected" }
          $groupSize = [Math]::Ceiling($browserNodes.Count / $groupCount)
          $start = ($shardIndex - 1) * $groupSize
          $end = [Math]::Min($start + $groupSize - 1, $browserNodes.Count - 1)
          if ($start -gt $end) {
            Write-Host "browser shard $shardIndex is empty; nothing to run"
            exit 0
          }
          [string[]] $chunk = $browserNodes[$start..$end]
          python -X faulthandler -m pytest $chunk -q --junitxml="artifacts/browser-tests-$shardIndex.xml"

      - name: Upload browser report
        if: failure() && steps.browser_suite.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests-report-${{ matrix.shard }}
          path: |
            artifacts/browser-tests-*.xml
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  required-check:
    name: Required CI
    if: always()
    needs:
      - quality
      - compatibility
      - security
      - core-tests
      - core-coverage
      - browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CORE_RESULT: ${{ needs.core-tests.result }}
          CORE_COVERAGE_RESULT: ${{ needs.core-coverage.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        shell: bash
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$CORE_RESULT" = "success"
          test "$CORE_COVERAGE_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
